name: Brief Pipeline Validation

on:
  pull_request:
    paths:
      - ".github/workflows/brief-live-refresh.yml"
      - ".github/workflows/brief-pipeline-validation.yml"
      - "docs/demo-runbook.md"
      - "docs/published-artifact-contract.md"
      - "scripts/refresh-game-prep-pipeline.sh"
      - "scripts/game_prep_brief/**"
      - "tests/**"
  workflow_dispatch:

jobs:
  offline-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pbp-analysis

    steps:
      - name: Checkout pbp-analysis
        uses: actions/checkout@v4
        with:
          path: pbp-analysis

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run brief-specific tests
        run: |
          python -m pytest -q \
            tests/test_game_prep_loader_artifacts.py \
            tests/test_scoring_zones_issue_158.py

      - name: Run offline pipeline validation
        run: |
          ./scripts/refresh-game-prep-pipeline.sh Washington "Ohio State" \
            --season 2025 \
            --mode offline-validate \
            --bundle-path "${PWD}/tests/fixtures/pipeline/pbp_stats_bundle_2025.json" \
            --reuse-bundle \
            --cfbstats-snapshot "${PWD}/tests/fixtures/pipeline/cfbstats_2025_snapshot.json" \
            --cfbstats-verification-report "${PWD}/tests/fixtures/pipeline/cfbstats_verification_2025_report.json" \
            --no-enrichment \
            --skip-tests \
            --brief-format markdown \
            --output-dir "${RUNNER_TEMP}/game_prep_brief" \
            --summary-json "${RUNNER_TEMP}/game_prep_pipeline_summary.json"

      - name: Upload pipeline summary
        uses: actions/upload-artifact@v4
        with:
          name: game-prep-pipeline-summary
          path: ${{ runner.temp }}/game_prep_pipeline_summary.json

      - name: Upload smoke brief
        uses: actions/upload-artifact@v4
        with:
          name: game-prep-smoke-brief
          path: ${{ runner.temp }}/game_prep_brief
